name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Validate workflow syntax
        run: ./actionlint -color
        shell: bash

  security-guard:
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for security guard
        run: pip install pytest
      - name: Run Secret Leak Guard
        run: python -m pytest tests/test_secret_leak_guard.py -v -W error::RuntimeWarning

  backend-validation:
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
      - name: Gate A - Compile
        run: python -m compileall backend
      - name: Gate B - Pytest
        env:
          CI: 'true'
          TESTING: 'true'
          MOCK_EXTERNAL_SERVICES: 'true'
        run: python -m pytest -W error::RuntimeWarning -v

  frontend-validation:
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Gate A - Lint
        run: npm --prefix frontend run lint
      - name: Gate B - Vitest
        run: npm --prefix frontend test -- --run
      - name: Gate C - Production Build
        run: npm --prefix frontend run build
      - name: Bundle Budget Enforcement
        run: |
          echo "Bundle budget: 400000 bytes"
          ENTRY_BUNDLE=$(find frontend/dist/assets -name "index-*.js" -not -name "index-*.css" | head -n 1)
          if [ -z "$ENTRY_BUNDLE" ]; then
            echo "ERROR: Could not find entry bundle."
            exit 1
          fi
          
          echo "Detected entry bundle: $ENTRY_BUNDLE"
          ACTUAL_SIZE=$(stat -c%s "$ENTRY_BUNDLE")
          BUDGET=400000
          
          echo "Actual size: $ACTUAL_SIZE bytes"
          
          if [ "$ACTUAL_SIZE" -gt "$BUDGET" ]; then
            EXCEEDED=$((ACTUAL_SIZE - BUDGET))
            echo "ERROR: JavaScript entry bundle exceeds the 400 kB budget."
            echo "Budget: $BUDGET bytes"
            echo "Actual: $ACTUAL_SIZE bytes"
            echo "Exceeded by: $EXCEEDED bytes"
            exit 1
          else
            REMAINING=$((BUDGET - ACTUAL_SIZE))
            echo "Remaining budget: $REMAINING bytes"
            echo "SUCCESS: Bundle is within budget."
          fi
          
          echo "Top JavaScript assets:"
          ls -lhS frontend/dist/assets/*.js | head -n 5
        shell: bash
