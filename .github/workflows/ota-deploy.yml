name: OTA Update Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'App.tsx'
      - 'package.json'
      # Exclude native code and build configs that require full binary recompilation
      - '!android/**'
      - '!ios/**'
      - '!app.json'
      - '!eas.json'

jobs:
  deploy-ota:
    name: Publish Over-The-Air Update (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS authentication
        run: npx eas whoami

      - name: Publish OTA Update to Production Channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas update --auto --channel production --message "Auto OTA Hotfix: ${{ github.event.head_commit.message }}"
